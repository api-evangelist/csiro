aid: csiro

name: CSIRO

description: 'CSIRO, the Commonwealth Scientific and Industrial Research Organisation, is Australia''s national science agency and innovation
  catalyst, an Australian Government body that solves major challenges through science and technology across areas such as agriculture, health,
  oceans and climate, energy, digital and space. Its Data Access Portal (DAP) publishes RESTful web service APIs: a public read-only /dap/ws/v2
  collections API for searching and retrieving research data collections, and a staff-only /dap/api/v2 deposit API. CSIRO was surfaced via the
  australia-apidays-2026 harvest.'

