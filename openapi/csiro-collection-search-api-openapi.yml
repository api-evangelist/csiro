openapi: 3.2.0
info:
  title: Csiro Collection Search API
  version: v2
  description: 'Operations tagged Collection Search across 2 of this provider''s published API definitions: csiro-dap-ws-v2-openapi.json, csiro-dap-ws-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Collection Search
paths:
  /ws/v2/collections/{dataCollectionId}/globus:
    post:
      tags:
      - Collection Search
      summary: Create globus guest collection mapped to a dap datacollection
      operationId: mapToGlobusCollection
      parameters:
      - name: dataCollectionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobusAuthCodeDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/advancedSearch:
    post:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections using advanced criteria
      operationId: doAdvancedSearch
      parameters:
      - name: p
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: sb
        in: query
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancedSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/tombstone/{dataCollectionId}:
    get:
      tags:
      - Collection Search
      operationId: getCollectionTombstone
      parameters:
      - name: dataCollectionId
        in: path
        required: true
        schema:
          type: string
      - name: resolvedDoi
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
      summary: Get collection tombstone
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections{ext}:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections matching specific…
      operationId: getCollections
      parameters:
      - name: ext
        in: path
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: <b>searchString</b> (optional) can be any text to be searched for and will be processed in the same manner as front page search. If not present all accessible collections will be returned.
        required: false
        schema:
          type: string
          default: ''
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        description: <b>showFacets</b> (optional) may be true or false. If not present it defaults to false. When true facet filter values will be returned in the query response. For further information on how to filter results using Faceting please refer to https://research.csiro.au/dap/developer-tools/search-facets
        required: false
        schema:
          type: boolean
          default: false
      - name: inclAttribution
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: atom
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            application/atom+xml:
              schema:
                type: object
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/versions:
    get:
      tags:
      - Collection Search
      operationId: getAllVersions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/VersionListDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/VersionListDto'
      summary: Get all versions
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/version-history:
    get:
      tags:
      - Collection Search
      operationId: getCollectionDataVersions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionVersionDto'
      summary: Get collection data versions
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/support:
    get:
      tags:
      - Collection Search
      operationId: getCollectionSupportingFileList
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportingFilesDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/SupportingFilesDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/SupportingFilesDto'
      summary: Get collection supporting file list
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/support/{fileId}:
    get:
      tags:
      - Collection Search
      operationId: getCollectionSupportingFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
      summary: Get collection supporting file
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/relatedcollections:
    get:
      tags:
      - Collection Search
      summary: Retrieve a list of 'Related Collections' for a given data collection id
      operationId: getRelatedCollections
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/metadata:
    get:
      tags:
      - Collection Search
      operationId: getCollectionMetadataList
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataStreamsDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/MetadataStreamsDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/MetadataStreamsDto'
      summary: Get collection metadata list
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/metadata/{type}:
    get:
      tags:
      - Collection Search
      operationId: getCollectionMetadataByType
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
      summary: Get collection metadata by type
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/images:
    get:
      tags:
      - Collection Search
      operationId: getCollectionImageFileList
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: p
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: rpp
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFilesDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataFilesDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataFilesDto'
      summary: Get collection image file list
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/files/excelExport:
    get:
      tags:
      - Collection Search
      operationId: getExportCollectionToExcel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: object
      summary: Get export collection to excel
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to get a collection using ID, DOI or PID.
      operationId: getCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          description: Collection has been withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{doi}/**:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to get a collection using ID, DOI or PID.
      operationId: getCollection_1
      parameters:
      - name: doi
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          description: Collection has been withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/searchbylocation:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections matching specific…
      operationId: getCollectionsByLocation
      parameters:
      - name: q
        in: query
        description: <b>searchString</b> (optional) can be any text to be searched for and will be processed in the same manner as front page search. If not present all accessible collections will be returned.
        required: false
        schema:
          type: string
          default: ''
      - name: browseType
        in: query
        description: <b>browseType</b> the browse type to search against e.g. kw
        required: false
        schema:
          type: string
      - name: browseValue
        in: query
        description: <b>browseValue</b> the value to search against the browse type.
        required: false
        schema:
          type: string
      - name: n
        in: query
        description: <b>north</b> (optional) the northern most point of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: s
        in: query
        description: <b>south</b> the southern most point of the desired area OR the Latitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: e
        in: query
        description: <b>east</b> (optional) the eastern most point of the desired area OR the longitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: w
        in: query
        description: <b>west</b> the Western most point  of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: locationSearchType
        in: query
        required: false
        schema:
          type: string
          default: INTERSECTION
          enum:
          - INTERSECTION
          - FULLYOUTSIDEOF
          - WITHIN
          - ENCLOSES
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        description: <b>showFacets</b> (optional) may be true or false. If not present it defaults to false. When true facet filter values will be returned in the query response. For further information on how to filter results using Faceting please refer to https://research.csiro.au/dap/developer-tools/search-facets
        required: false
        schema:
          type: boolean
          default: false
      - name: inclAttribution
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: atom
        in: query
        description: <b>ATOM</b> - Flag that indicates if atom feed should be generated.
        required: false
        schema:
          type: boolean
      - name: searchType
        in: query
        description: <b>searchType</b> - Type of area search (optional) may be INTERSECTION, FULLYOUTSIDEOF, WITHIN, or ENCLOSES. If not present it defaults to INTERSECTION.  This parameter is case sensitive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/search:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections by lead researcher or…
      operationId: getCollectionsSearch
      parameters:
      - name: name
        in: query
        description: <b>Name</b> (optional) returns collections which include the name as a lead researcher or contributor. Value can be a CSIRO username, or CSIRO email prefix (e.g. john.citizen), or combination of firstname and/or lastname (John Citizen/John John/John/John)
        required: false
        schema:
          type: string
          default: ''
      - name: cc
        in: query
        description: <b>Cost Centre</b> (optional) returns collections related to a Team given the cost centre code of the team. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Teams" endpoint use the "Id" key as your "Cost Centre" search).
        required: false
        schema:
          type: string
          default: ''
      - name: bu
        in: query
        description: <b>Business Unit</b> (optional) returns collections related to a Business Unit given the SAP code of the Business Unit. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (note that the results in OrgUnitServ use the key "Id" instead of "BusinessUnitCode").
        required: false
        schema:
          type: string
          default: ''
      - name: rp
        in: query
        description: <b>Research Program</b> (optional) returns collections related to a Research Program given the SAP code of the Research Program. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Programs" endpoint use the "Id" key as your "Research Program" search). Note that for these purposes "Program" means the program associated with a Business Unit, not the program associated with a WBS.
        required: false
        schema:
          type: string
          default: ''
      - name: rg
        in: query
        description: <b>Research Group</b> (optional) returns collections related to a Research Group given the SAP code of the Research Group. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Groups" endpoint use the "Id" key as your "Research Group" search).
        required: false
        schema:
          type: string
          default: ''
      - name: wbs
        in: query
        description: <b>WBS Code</b> (optional), must be at least 4 characters, returns collections related to a Project using the SAP WBS code for the project. You only need to use the first part of the code. For example R-001 finds R-00100-03 and R-00100-02-001 (DAP has R-xxxxxx, and R-xxxxx-xx formats)
        required: false
        schema:
          type: string
          default: ''
      - name: for
        in: query
        description: <b>Field of Research Code</b> (optional) returns collections related to an ANZ Field of Research (FOR) code. Use a FOR code or any part of a description. The code search looks for the beginning of any code and is hierarchical, e.g. 01 will return all mathematical sciences, 0101 will return a subset of mathematical sciences. The description search is auto expanded. For example the description "geo" will return both "GEOCHEMISTRY" and "Hydrogeology" See  <a href="https://vocabs.ands.org.au/anzsrc-for/">link</a> for the codes.
        required: false
        schema:
          type: string
          default: ''
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
