  /ws/v2/collections/searchByIndex:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to browse collections using certain keywords
      operationId: getCollectionByIndex
      parameters:
      - name: q
        in: query
        description: <b>searchString</b> (optional) can be any text to be searched for and will be processed in the same manner as front page search. If not present all accessible collections will be returned.
        required: false
        schema:
          type: string
          default: ''
      - name: browseType
        in: query
        description: <b>browseType</b> (optional) the browse type to search against e.g. kw
        required: false
        schema:
          type: string
          default: ''
      - name: browseValue
        in: query
        description: <b>browseValue</b> (optional) the value to search against the browse type.
        required: false
        schema:
          type: string
          default: ''
      - name: n
        in: query
        description: <b>north</b> (optional) the northern most point of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: s
        in: query
        description: <b>south</b> the southern most point of the desired area OR the Latitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: e
        in: query
        description: <b>east</b> (optional) the eastern most point of the desired area OR the longitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: w
        in: query
        description: <b>west</b> the Western most point  of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: searchType
        in: query
        description: <b>searchType</b> - Type of area search (optional) may be INTERSECTION, FULLYOUTSIDEOF, WITHIN, or ENCLOSES. If not present it defaults to INTERSECTION.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: INTERSECTION
          enum:
          - INTERSECTION
          - FULLYOUTSIDEOF
          - WITHIN
          - ENCLOSES
      - name: index
        in: query
        description: <b>index</b> is the position of the required data collection in the search results.
        required: true
        schema:
          type: integer
          format: int32
          default: 1
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/browse/{browseType}/{browseValue}:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to browse collections using certain keywords
      operationId: getCollectionsByBrowse
      parameters:
      - name: browseType
        in: path
        description: <b>browseType</b> the browse type to search against e.g. kw
        required: true
        schema:
          type: string
      - name: browseValue
        in: path
        description: <b>browseValue</b> the value to search against the browse type.
        required: true
        schema:
          type: string
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        description: <b>showFacets</b> (optional) may be true or false. If not present it defaults to false. When true facet filter values will be returned in the query response. For further information on how to filter results using Faceting please refer to https://research.csiro.au/dap/developer-tools/search-facets
        required: false
        schema:
          type: boolean
          default: false
      - name: atom
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
