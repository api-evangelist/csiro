components:
  schemas:
    OrcidUserDTO:
      type: object
      properties:
        ident:
          type: string
    OrcidIdentifierDto:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        url:
          type: string
      xml:
        name: OrcidIdentifier
    ContributorDto:
      type: object
      properties:
        name:
          type: string
        orcidId:
          type: string
      xml:
        name: Contributor
    OrcidWorkDTO:
      type: object
      properties:
        orcid:
          type: string
        dataCollection:
          type: string
        workId:
          type: string
    OrcidCollectionDto:
      type: object
      properties:
        description:
          type: string
        collectionType:
          type: string
        title:
          type: string
        attributionStatement:
          type: string
        published:
          type: string
        identifier:
          $ref: '#/components/schemas/OrcidIdentifierDto'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/ContributorDto'
          xml:
            wrapped: true
        workId:
          type: string
        language:
          type: string
      xml:
        name: OrcidCollection
    OrcidResultsDto:
      type: object
      properties:
        timestamp:
          type: string
        users:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/OrcidCollectionDto'
      xml:
        name: OrcidResults
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/0fe05593-19ac-4f98-adbf-0375fce7f160/oauth2/v2.0/authorize
          tokenUrl: /dap/auth/csiro/token
          scopes:
            openid: OpenID Connect
