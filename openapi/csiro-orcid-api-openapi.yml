info:
  title: Csiro ORCID API
  version: v2
  description: 'Operations tagged ORCID across 2 of this provider''s published API definitions: csiro-dap-orcid-v1-openapi.json, csiro-dap-orcid-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
