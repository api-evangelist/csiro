      tags:
      - ORCID
      operationId: getWorksForAllUsers
      parameters:
      - name: since
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcidResultsDto'
      summary: Get works for all users
      x-summary-source: derived
