openapi: 3.2.0
info:
  title: Csiro External Systems API
  version: v2
  description: 'Operations tagged External Systems across 2 of this provider''s published API definitions: csiro-dap-ws-v2-openapi.json, csiro-dap-ws-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: External Systems
paths:
  /ws/v2/tags:
    get:
      tags:
      - External Systems
      operationId: getAllExternalSystemTags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSystemListDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ExternalSystemListDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/ExternalSystemListDto'
      summary: Get all external system tags
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/tags/{tagName}:
    get:
      tags:
      - External Systems
      operationId: getCollectionsByExternalSystemTag
      parameters:
      - name: tagName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionListDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionListDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionListDto'
      summary: Get collections by external system tag
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
