          - asc
          - desc
      - name: showFacets
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: fSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: collector
        in: query
        description: <b>Collector</b> (optional) returns specimen images which include collector name.
