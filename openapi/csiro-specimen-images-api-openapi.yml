          type: string
      - name: any
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: taxonomy
        in: query
        description: '<b>Taxonomy</b> (optional) returns specimen images which include the either the kingdom, phylum, class, order,family, subfamily, genus, subgenus, species, subspecies or scientific name as the taxonomy. Value can be a Plantae, Commelinaceae, Commelina, tricarinata etc '
        required: false
        schema:
          type: array
          items:
            type: string
      - name: specimenId
        in: query
        description: <b>SpecimenId</b> (optional) returns specimen images which include the either the accession number or the catalog number as the specimenId.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: dataCollectionId
        in: query
        required: false
        schema:
          type: string
      - name: fieldNumber
        in: query
        description: '<b>FieldNumber</b> (optional) returns specimen images which include field number '
        required: false
        schema:
          type: array
          items:
            type: string
      - name: dataAccessLevel
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: <b>General Search</b> (optional) performs a general search across taxonomy (kingdom, phylum, class, order, family, subfamily, genus, subgenus, species, subspecies, scientific names), catalog number, accession number, and field number. This parameter searches across multiple fields simultaneously.
        required: false
        schema:
          type: string
          default: ''
      - name: p
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: sb
        in: query
        required: false
        schema:
          type: string
          default: catalogNumber
      - name: so
        in: query
        required: false
        schema:
          type: string
          default: asc
