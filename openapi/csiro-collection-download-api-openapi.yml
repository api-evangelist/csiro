      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/files/list:
    get:
      tags:
      - Collection Download
      summary: This function allows a client to download a text file with download links for…
      operationId: getDownloadListFile
      parameters:
      - name: id
        in: path
        required: true
