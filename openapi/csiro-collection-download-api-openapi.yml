    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{collectionId}/downloadfile:
    get:
      tags:
      - Collection Download
      summary: This function allows a client to retrieve a single file by name from a…
      operationId: getDownloadFile
      parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
components:
  schemas:
    FileNameDTO:
      type: object
      properties:
        dataCollectionId:
          type: integer
          format: int32
        fileName:
          type: string
    DownloadRequestLogDto:
      type: object
      properties:
        ror:
          type: string
        dataObjectIds:
          type: array
          items:
            type: integer
            format: int64
        institution:
          type: string
        reason:
          type: string
        country:
          type: string
        dataCollectionType:
          type: string
    RestrictedDownloadRequestDto:
      type: object
      properties:
        ror:
          type: string
        dataObjectIds:
          type: array
          items:
            type: integer
            format: int64
        institution:
          type: string
        reason:
          type: string
        dataCollectionType:
          type: string
        name:
          type: string
        email:
          type: string
        descriptionOfUse:
          type: string
        country:
          type: string
    DownloadFileDTO:
      type: object
      properties:
        fileName:
          type: string
        filePath:
          type: string
        fileSize:
          type: integer
          format: int64
        filePresignedUrl:
          type: string
          format: url
    DownloadCollectionDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DownloadFileDTO'
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/DownloadFileDTO'
    FileListDTO:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileNameDTO'
        email:
          type: string
    DownloadDto:
      type: object
      properties:
        filePaths:
          type: array
          items:
            type: string
          xml:
            wrapped: true
        folders:
          type: array
          items:
            type: string
          xml:
            wrapped: true
        allFiles:
          type: boolean
        email:
          type: string
          xml:
            wrapped: true
      xml:
        name: download
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/0fe05593-19ac-4f98-adbf-0375fce7f160/oauth2/v2.0/authorize
          tokenUrl: /dap/auth/csiro/token
          scopes:
            openid: OpenID Connect
