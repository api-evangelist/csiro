    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/downloadzip:
    get:
      tags:
      - Collection Download
      summary: This function returns an empty DownloadDto.
      operationId: getDownloadZipEmptyDTO
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
