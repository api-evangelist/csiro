openapi: 3.2.0
info:
  title: Csiro Collection Download API
  version: v2
  description: 'Operations tagged Collection Download across 2 of this provider''s published API definitions: csiro-dap-ws-v2-openapi.json, csiro-dap-ws-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Collection Download
paths:
  /ws/v2/collections/{collectionId}/downloadzip:
    post:
      tags:
      - Collection Download
      summary: Retrieve a ZIP of a subset of files in the collection
      operationId: getDownloadZip_1
      parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadDto'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{collectionId}/downloadurls:
    post:
      tags:
      - Collection Download
      summary: Retrieve an object with a subset of files in the collection
      operationId: getDownloadUrls
      parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DownloadCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/download/restricted:
    post:
      tags:
      - Collection Download
      operationId: restrictedDownloadRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictedDownloadRequestDto'
        required: true
      responses:
        '200':
          description: OK
      summary: Restricted download request
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/download/restricted/{id}/regenerate:
    post:
      tags:
      - Collection Download
      operationId: regenerateRestrictedDownloadRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      summary: Regenerate restricted download request
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/download/log:
    post:
      tags:
      - Collection Download
      operationId: addDownloadRequestLog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequestLogDto'
        required: true
      responses:
        '200':
          description: OK
      summary: Add download request log
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/domain/downloadzip:
    post:
      tags:
      - Collection Download
      summary: This function allows a client to retrieve a ZIP of a subset of files across…
      operationId: getDownloadDomainZip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileListDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/domain/downloadurls:
    post:
      tags:
      - Collection Download
      summary: Retrieve an object with a subset of files in the collection
      operationId: getDownloadUrlsDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileListDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DownloadCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/domain/downloadtar:
    post:
      tags:
      - Collection Download
      summary: Retrieve a TAR of a subset of files across different collections
      operationId: getDownloadDomainTar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileListDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /ws/v2/collections/{id}/licence:
    get:
      tags:
