  /api/v2/users/search:
    get:
      tags:
      - Api-V2 Supporting Data
      summary: Search for users by search term
      operationId: getUsersBySearchTerm
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: csiroOnly
        in: query
        description: Should CSIRO only users be returned. If false, external users will be included.  E.g. Partners, AAF, Data central, etc...
        required: true
        schema:
          type: boolean
      - name: includeCeased
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserEntityDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/users/organisations/search:
    get:
