openapi: 3.2.0
info:
  title: Csiro Api-V2 Supporting Data API
  version: v2
  description: 'Operations tagged Api-V2 Supporting Data across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 Supporting Data
paths:
  /api/v2/help/page/{page}/{key}:
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update existing help text item
      operationId: updateHelpText
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/doiFiles:
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update DoiFilesDataset record. Requires admin priveledges
      operationId: updateDoiFilesDataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoiFilesDatasetDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoiFilesDatasetDTO'
    post:
      tags:
      - Api-V2 Supporting Data
      summary: Create new DOI and save to new DoiFilesDataset record
      operationId: createDoiFilesDataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoiFilesDatasetDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoiFilesDatasetDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collectionTemplates/{id}:
    get:
      tags:
      - Api-V2 Supporting Data
      summary: Retrieve a collection template by id
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update existing template
      operationId: saveTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCollectionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TemplateSubmitValidationDTO'
    delete:
      tags:
      - Api-V2 Supporting Data
      summary: Delete a collection template by id
      operationId: deleteTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/activities/{activityId}:
    get:
      tags:
      - Api-V2 Supporting Data
      summary: Retrieve activity by id
      operationId: getActivity
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ActivityDTO'
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update an existing activity
      operationId: updateActivity
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ActivityDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/users:
    post:
      tags:
      - Api-V2 Supporting Data
      summary: Create a new user
      description: Create a new user. Used when creating / editing a collection and a new contributor is required, for example.
      operationId: createNewUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEntityDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserEntityDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/users/organisations:
