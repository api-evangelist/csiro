      - Api-V2 Supporting Data
      summary: Search for approvers
      description: Return a list of Approvers that belong to the User's Business Unit or a passed in Business Unit. If buName is specified, then the Approvers will be for that Business Unit.
      operationId: getApprovers
      parameters:
      - name: buName
        in: query
        description: The users business unit.
        required: false
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserEntityDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/users/approvers/nrca/search:
