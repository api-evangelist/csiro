      - name: uuid
        in: path
        required: true
        schema:
          type: string
      - name: resolvedDoi
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TombstoneDTO'
      summary: Get data set tombstone
      x-summary-source: derived
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/settings:
