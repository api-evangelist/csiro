    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collectionTemplates/{type}:
    post:
      tags:
      - Api-V2 Supporting Data
      summary: Create a new template
      operationId: createNewTemplate
      parameters:
      - name: type
        in: path
        description: 'Collection type.  E.g. AAHL, PULSAR, HTTP_UPLOADED_FILES, etc... '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collectionTemplates/{id}/copy:
    post:
