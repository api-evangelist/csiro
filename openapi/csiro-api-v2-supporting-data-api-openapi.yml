      summary: Create a new activity for a collection
      description: If wbsCode is specified, then the activities will be those for that project. Else, if nationalFacility is specified, then activities for that facility are returned. Else, if nationalCollection is specified, then activities for that national collection are returned. Else, if fromExternalSource is true, then activities of type 'ACQUIRED' are returned. Else, activities of type 'LEGACY' are returned.
      operationId: getActivities
      parameters:
      - name: wbsCode
        in: query
        description: Project WBS code (can be empty).
        required: false
        schema:
          type: string
          default: ''
      - name: nationalFacility
        in: query
        description: National facility code (can be empty).
        required: false
        schema:
          type: string
          default: ''
      - name: nationalCollection
        in: query
        description: National collection code (can be empty).
        required: false
        schema:
          type: string
          default: ''
      - name: fromExternalSource
        in: query
        description: True if for a collection from an external source.
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
