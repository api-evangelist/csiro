  /api/v2/serviceMetadata:
    get:
      tags:
      - Api-V2 Supporting Data
      summary: Harvest OGC Service metadata
      description: Note. This endpoint only supports OGC service types OGC_WMS, OGC_WFC and OGC_WMS
      operationId: harvestServiceMetadata
      parameters:
      - name: serviceUrl
        in: query
        required: true
        schema:
          type: string
      - name: serviceType
        in: query
        required: true
        schema:
          type: string
      responses:
