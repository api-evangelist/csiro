openapi: 3.2.0
info:
  title: Csiro Api-V2 Admin API
  version: v2
  description: 'Operations tagged Api-V2 Admin across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 Admin
