  /api/v2/admin/organisations/updateROR:
    post:
      tags:
      - Api-V2 Admin
      summary: Update organisations with ROR Id
      description: 'You must provide a text CSV file using either ANSI encoding or UTF-8 without a Byte Order Mark. The CSV file must contain the columns "ORG_ID" and "ROR_ID", other columns are permitted but will be ignored. "ORG_ID" is the ID value for the the organisation in DAP. "ROR_ID" is the ROR URL for the organisation.

        The correct content type to specify for the file is "text/csv". Note that if using Firefox on Windows, this Swagger page will provide an incorrect content type and return a 400 error. Firefox will use the operating system''s content type for ".csv" files, which on Windows is "application/vnd.ms-excel". Other browsers, or Firefox running on a different operating system, should use the correct content type.'
      operationId: updateOrgsWithRORId
