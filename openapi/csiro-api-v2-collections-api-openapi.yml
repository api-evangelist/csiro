openapi: 3.2.0
info:
  title: Csiro Api-V2 Collections API
  version: v2
  description: 'Operations tagged Api-V2 Collections across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 Collections
paths:
  /api/v2/system/collections/{id}:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve collection for a system user for editing by id
      operationId: getCollectionForSystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    put:
      tags:
      - Api-V2 Collections
      summary: Save collection as draft by a system user
      operationId: saveCollectionBySystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCollectionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete draft collection by system user
      operationId: deleteCollectionBySystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve collection for editing by id
      operationId: getCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    put:
      tags:
      - Api-V2 Collections
      summary: Save draft collection
      operationId: saveCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCollectionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete draft collection
      operationId: deleteCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/files/{fileId}:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the metadata of a single file
      operationId: updateFileMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: fileId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDto'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/files/bulk:
    put:
      tags:
      - Api-V2 Collections
      summary: Selectively update the metadata of multiple files
      operationId: bulkUpdateFileMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFileMetadataDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFileMetadataResultDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/casdaFiles/resolve:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the Pawsey file paths for a CASDA derived data collection and return the…
      operationId: resolvePaths
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaPathsDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CasdaFileDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{dataCollectionId}/permitted-users:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the permitted users of a collection by depositor without creating a new…
      operationId: updatePermittedUsers
      parameters:
      - name: dataCollectionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlListDto'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{dataCollectionId}/embargo-acccess:
    put:
      tags:
      - Api-V2 Collections
      summary: update the permitted users for a given embargoed collection
      operationId: updatePermittedUsersEmbargo
      parameters:
      - name: dataCollectionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlListDto'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/system/collections/{type}:
    post:
      tags:
      - Api-V2 Collections
      summary: Create and save a new self service draft collection by a system user
      operationId: createNewCollectionForSystemUser
      parameters:
      - name: type
        in: path
        description: Collection type.  E.g. HTTP_UPLOADED_FILES, AAHL, etc...
        required: true
        schema:
          type: string
      - name: templateId
        in: query
        description: The collection Id of an existing collection to use a template.
        required: false
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{type}:
    post:
      tags:
      - Api-V2 Collections
      summary: Create a new self service draft collection and save it
      operationId: createNewCollection
      parameters:
      - name: type
        in: path
        description: Collection type.  E.g. HTTP_UPLOADED_FILES, AAHL, etc...
        required: true
        schema:
          type: string
      - name: templateId
        in: query
        description: The collection Id of an existing collection to use a template.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/{type}/update:
    post:
      tags:
      - Api-V2 Collections
      summary: Update type of a service collection to generic or software.
      operationId: updateAndAddFiles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/update:
    post:
      tags:
      - Api-V2 Collections
      summary: Update a collection. Creates a new version of a collection
      operationId: updateCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/supportingFiles:
    post:
      tags:
      - Api-V2 Collections
      summary: Upload supporting file
      description: Note. For the best user experience uploading mutliple files, an API tool such as Postman is recommended.
      operationId: uploadSupportingFiles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: supportingFileType
        in: query
        description: Type of supporting file. I.e. SUPPORT, APPROVER, LICENCE.
        required: true
        schema:
          type: string
      - name: files
        in: query
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportingFileDTO'
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete supporting file(s)
      operationId: deleteSupportingFiles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: supportingFileType
        in: query
        description: Type of supporting file. I.e. SUPPORT, APPROVER, LICENCE.
        required: true
        schema:
          type: string
      - name: deleteFiles
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportingFileDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/submit:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve the current approval details as a starting point for submitting the…
      operationId: getCollectionSubmit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApprovalDTO'
    post:
      tags:
      - Api-V2 Collections
      summary: Submit a previously saved draft data collection for approval or direct…
      description: Submit a previously saved draft data collection for approval or direct publishing. The selection of approver and any submission notes are saved. The collection will be validated and (if selected) the suitability for bypassing approval checked. The collection will then be scheduled for a batch submit.
      operationId: submitCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/returnToDraft:
    post:
      tags:
      - Api-V2 Collections
      summary: Return a collection to Draft, if it is submitted but not approved
      operationId: returnToDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/reassign:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve the current depositor details as a starting point for reassigning the…
      operationId: getCollectionReassignInfo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReassignDTO'
    post:
      tags:
      - Api-V2 Collections
      summary: Reassign a data collection
      operationId: reassignCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/folders:
    get:
      tags:
      - Api-V2 Collections
      summary: Get the folder tree for a given collection
      operationId: getFolders
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileFolderDTO'
    post:
      tags:
      - Api-V2 Collections
      summary: Create a folder for a draft collection
      operationId: createFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: path
        in: query
        description: The path of the folder to create. E.g. /d1/d2
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete a folder in a draft collection
      operationId: deleteFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: path
        in: query
        description: The path of the folder to delete. E.g. /d1/d2
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/files:
    get:
      tags:
      - Api-V2 Collections
      summary: Get a list files for a given folder and page number
      operationId: getFilesForFolder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: q
        in: query
        description: Query string search for file name.
        required: false
        schema:
          type: string
      - name: folder
        in: query
        description: Relative folder path to retrieve files for.
        required: true
        schema:
          type: string
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: sb
        in: query
        description: Name of the field to sort by.
        required: false
        schema:
          type: string
          default: filename
      - name: so
        in: query
        description: Sort order.  ASC or DESC.
        required: false
        schema:
          type: string
          default: ASC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesDto'
    post:
      tags:
      - Api-V2 Collections
      summary: Upload files
      description: Note. For the best user experience uploading mutliple files, an API tool such as Postman is recommended.
      operationId: uploadFiles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: path
        in: query
        description: The relative path of the folder in which to place the file. e.g. /folderName
        required: true
        schema:
          type: string
      - name: file
        in: query
        required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - file
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete a file from the file system for a draft collection
      operationId: deleteFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: path
        in: query
        description: The relative path of the file. E.g. /folderName/fileName.png
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/files/unlock:
    post:
      tags:
      - Api-V2 Collections
      summary: Unlock files so that they can be modified.
      operationId: modifyFiles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/copy:
    post:
      tags:
      - Api-V2 Collections
      summary: Copy an existing collection. Creates a new collection
      operationId: copyCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: query
        description: The name / title to give the new collection.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/changeCollaborators:
    post:
      tags:
      - Api-V2 Collections
      summary: Change the deposit collaborators of a collection
      operationId: changeDepositCollaborators
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DepositCollaboratorDto'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/changeApprover:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve the approver details as the first step to changing approver
      operationId: getChangeApprover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChangeApproverDTO'
    post:
      tags:
      - Api-V2 Collections
      summary: Change the approver of a collection
      operationId: changeApprover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApproverDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/{id}/amend:
    post:
      tags:
      - Api-V2 Collections
      summary: re-opens a collections so files can be amended and the collection republished
      operationId: amendCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/xml:
    post:
      tags:
      - Api-V2 Collections
      summary: Create collections from XML metadata files.
      operationId: createCollectionsFromXml
      parameters:
      - name: collectionType
        in: query
        required: false
        schema:
          type: string
      - name: files
        in: query
        required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XmlCollectionSummaryDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/xml/validate:
    post:
      tags:
      - Api-V2 Collections
      summary: Upload XML metadata files for preliminary validation
      operationId: getXmlUploadValidate
      parameters:
      - name: files
        in: query
        required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XmlCollectionSummaryDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/casda/{projectCode}:
    post:
      tags:
      - Api-V2 Collections
      summary: Create a derived CASDA collection for an ATNF project
      operationId: createCasdaDerivedCollection
      parameters:
      - name: projectCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int32
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/collections/atnf/{projectCode}:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve a list of the 'master' collections for an ATNF pulsar project
      operationId: listPulsarMasterCollections
      parameters:
      - name: projectCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
