openapi: 3.2.0
info:
  title: Csiro Api-V2 User Profile API
  version: v2
  description: 'Operations tagged Api-V2 User Profile across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 User Profile
paths:
  /api/v2/user/profile/s3-access-keys:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieves the user's S3 access keys.
      operationId: getOrCreateAccessKeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/S3AccessKeysDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Refresh the user's S3 access keys in storage grid and store in DAP.
      operationId: refreshAccessKeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/S3AccessKeysDTO'
    delete:
      tags:
      - Api-V2 User Profile
      summary: Delete the user's S3 access keys
      operationId: deleteAccessKeys
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/profile/restAccounts:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's rest accounts
      operationId: getUserRestAccounts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRESTAccountDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's rest accounts
      operationId: updateUserRestAccounts
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserRESTAccountDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRESTAccountDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/profile/projectDetails:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's project details
      operationId: getUserProjectDefaults
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's project details
      operationId: updateUserProjectDefaults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/profile/organisationalDetails:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's organisational details
      operationId: getUserOrgDefaults
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserOrgDetailsDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's organisational details
      operationId: updateUserOrgDefaults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserOrgDetailsDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserOrgDetailsDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/profile/storagegrid-s3-access-keys:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieves the current logged-in user's S3 access keys from StorageGrid
      operationId: getStorageGridS3AccessKeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageGridS3AccessKeyDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/capabilities:
    get:
      tags:
      - Api-V2 User Profile
      summary: Get the current user's capabilities
      operationId: getCapabilities
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserCapabilitiesDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/user/profile/storagegrid-s3-access-keys/{id}:
    delete:
      tags:
      - Api-V2 User Profile
      summary: Deletes the given storage grid access key for the current logged in user
      operationId: deleteStorageGridS3AccessKey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
components:
  schemas:
    UserOrgDetailsDTO:
      type: object
      properties:
        nationalFacility:
          type: string
        costCentreBusinessUnit:
          $ref: '#/components/schemas/OrgNodeDTO'
        costCentreTeam:
          $ref: '#/components/schemas/OrgNodeDTO'
    UserRESTAccountDTO:
      type: object
      properties:
        userName:
          type: string
        password:
          type: string
        active:
          type: boolean
        regenerate:
          type: boolean
    StorageGridS3AccessKeyDTO:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        expires:
          type: string
          format: date-time
        userUUID:
          type: string
        accountId:
          type: string
        secretAccessKey:
          type: string
    UserCapabilitiesDTO:
      type: object
      properties:
        manageProjectTeams:
          type: boolean
        manageHelpMessages:
          type: boolean
        manageDataCollection:
          type: boolean
        manageExternalTags:
          type: boolean
        manageFeaturedCollections:
          type: boolean
        manageRESTUsers:
          type: boolean
        manageLookupTable:
          type: boolean
        manageOrganisations:
          type: boolean
        manageUsers:
          type: boolean
        manageSystemTasks:
          type: boolean
        manageLicences:
          type: boolean
        manageOrgData:
          type: boolean
        validateCasdaProjects:
          type: boolean
        accessToUserProfile:
          type: boolean
        canImpersonate:
          type: boolean
    S3AccessKeysDTO:
      type: object
      properties:
        accesskey:
          type: string
          writeOnly: true
        secretAccessKey:
          type: string
        expires:
          type: string
          format: date-time
          writeOnly: true
        accessKey:
          type: string
        accessKeyExpiryDate:
          type: string
          format: date-time
    ProjectDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wbsCode:
          type: string
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        inactive:
          type: boolean
        projectLeader:
          $ref: '#/components/schemas/UserEntityDto'
        editedProjectName:
          type: string
        editedProgramName:
          type: string
    OrgNodeDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nodeCode:
          type: string
        description:
          type: string
        inactive:
          type: boolean
    UserEntityDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userName:
          type: string
        email:
          type: string
        loginSystem:
          type: string
        distinguishedName:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        surname:
          type: string
        organisation:
          type: string
        organisationDisplay:
          type: string
        rorId:
          type: string
        country:
          type: string
        countryDisplayName:
          type: string
        state:
          type: string
        type:
          type: string
        city:
          type: string
        notes:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/0fe05593-19ac-4f98-adbf-0375fce7f160/oauth2/v2.0/authorize
          tokenUrl: /dap/auth/csiro/token
          scopes:
            openid: OpenID Connect
x-refined-from:
- csiro-dap-api-v2-openapi.json
- csiro-dap-api-v2-openapi.yml
