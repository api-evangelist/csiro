# x-archived-from: csiro-dap-api-v2-openapi.yml
# x-archived-on: 2026-10-22
openapi: 3.1.0
info:
  title: CSIRO Data Access Portal
  description: REST API for the CSIRO Data Access Portal (DAP).
  version: v2
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
paths:
  /api/v2/usertasks/{taskId}/approval:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve details for the collection approver.
      operationId: getApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Approval task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApproverDecisionDTO'
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save an approval decision (without submitting the decision).
      operationId: saveApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproverDecisionDTO'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/usertasks/{taskId}/approval/submit:
    put:
      tags:
      - Api-V2 User Tasks
      summary: Submit an approval decision and start any downstream processing.
      operationId: submitApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproverDecisionDTO'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/usertasks/{taskId}/advice:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve an approval advice record.
      operationId: getAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApprovalAdviceDTO'
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save an advice request (without submitting).
      operationId: saveAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAdviceDTO'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/usertasks/{taskId}/advice/submit:
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save and submit an advice request.
      operationId: submitAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAdviceDTO'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/user/profile/s3-access-keys:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieves the user's S3 access keys. Those keys are required if the user wants to upload and store collection in AWS S3 storage space.
      operationId: getOrCreateAccessKeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/S3AccessKeysDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Refresh the user's S3 access keys in storage grid and store in DAP. (Note existing access keys will not be removed and will continue to work)
      operationId: refreshAccessKeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/S3AccessKeysDTO'
    delete:
      tags:
      - Api-V2 User Profile
      summary: Delete the user's S3 access keys.
      operationId: deleteAccessKeys
      responses:
        '200':
          description: OK
  /api/v2/user/profile/restAccounts:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's rest accounts.
      operationId: getUserRestAccounts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRESTAccountDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's rest accounts.
      operationId: updateUserRestAccounts
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserRESTAccountDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRESTAccountDTO'
  /api/v2/user/profile/projectDetails:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's project details.
      operationId: getUserProjectDefaults
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's project details.
      operationId: updateUserProjectDefaults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectDTO'
  /api/v2/user/profile/organisationalDetails:
    get:
      tags:
      - Api-V2 User Profile
      summary: Retrieve the current user's organisational details.
      operationId: getUserOrgDefaults
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserOrgDetailsDTO'
    put:
      tags:
      - Api-V2 User Profile
      summary: Update the current user's organisational details.
      operationId: updateUserOrgDefaults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserOrgDetailsDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserOrgDetailsDTO'
  /api/v2/system/collections/{id}:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve collection for a system user for editing by id.
      operationId: getCollectionForSystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    put:
      tags:
      - Api-V2 Collections
      summary: Save collection as draft by a system user.
      operationId: saveCollectionBySystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCollectionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete draft collection by system user.
      operationId: deleteCollectionBySystemUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ident
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/help/page/{page}/{key}:
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update existing help text item.
      operationId: updateHelpText
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpDto'
  /api/v2/doiFiles:
    put:
      tags:
      - Api-V2 Supporting Data
      summary: Update DoiFilesDataset record. Requires admin priveledges.
      operationId: updateDoiFilesDataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoiFilesDatasetDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoiFilesDatasetDTO'
    post:
      tags:
      - Api-V2 Supporting Data
      summary: Create new DOI and save to new DoiFilesDataset record.
      operationId: createDoiFilesDataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoiFilesDatasetDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoiFilesDatasetDTO'
  /api/v2/collections/{id}:
    get:
      tags:
      - Api-V2 Collections
      summary: Retrieve collection for editing by id.
      operationId: getCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    put:
      tags:
      - Api-V2 Collections
      summary: Save draft collection.
      operationId: saveCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCollectionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDTO'
    delete:
      tags:
      - Api-V2 Collections
      summary: Delete draft collection.
      operationId: deleteCollection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v2/collections/{id}/files/{fileId}:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the metadata of a single file
      operationId: updateFileMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: fileId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDto'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/collections/{id}/files/bulk:
    put:
      tags:
      - Api-V2 Collections
      summary: Selectively update the metadata of multiple files
      operationId: bulkUpdateFileMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFileMetadataDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFileMetadataResultDTO'
  /api/v2/collections/{id}/casdaFiles/resolve:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the Pawsey file paths for a CASDA derived data collection and return the files found in those paths.
      operationId: resolvePaths
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaPathsDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CasdaFileDTO'
  /api/v2/collections/{dataCollectionId}/permitted-users:
    put:
      tags:
      - Api-V2 Collections
      summary: Update the permitted users of a collection by depositor without creating a new version
      operationId: updatePermittedUsers
      parameters:
      - name: dataCollectionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlListDto'
        required: true
      responses:
        '200':
          description: OK
  /api/v2/collections/{dataCollectionId}/embargo-acccess:
    put:
      tags:
      - Api-V2 Collections
      summary: update the permitted users for a given embargoed collection
      operationId: updatePermittedUsersEmbargo
