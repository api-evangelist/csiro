    delete:
      tags:
      - Api-V2 Admin
      summary: Delete rest user.
      operationId: deleteRestUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v2/admin/other-users/{id}:
    put:
      tags:
      - Api-V2 Admin
      summary: Update the details for a given user. Note only non-CSIRO (type OTHER_USER) users supported.
      operationId: updateOtherUser
      parameters:
      - name: id
        in: path
        required: true
