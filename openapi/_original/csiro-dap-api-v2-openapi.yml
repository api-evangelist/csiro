  /api/v2/admin/lookups/{lookupGroup}:
    get:
      tags:
      - Api-V2 Admin
      summary: Returns list of lookup values for a lookup group.
      operationId: getLookupValues
      parameters:
      - name: lookupGroup
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupValueDTO'
    put:
      tags:
      - Api-V2 Admin
      summary: Update a existing lookup value in the lookup group.
      operationId: updateLookupValue
      parameters:
      - name: lookupGroup
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupValueDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LookupValueDTO'
    post:
      tags:
      - Api-V2 Admin
      summary: Create a new lookup value in the lookup group.
      operationId: createLookupValue
      parameters:
      - name: lookupGroup
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupValueDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LookupValueDTO'
    delete:
      tags:
      - Api-V2 Admin
      summary: Delete lookup group value.
      operationId: deleteLookupValue
      parameters:
      - name: lookupGroup
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/admin/licences/{id}:
    put:
      tags:
