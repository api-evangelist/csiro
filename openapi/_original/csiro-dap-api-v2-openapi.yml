          description: OK
  /api/v2/collectionTemplates/{id}:
    get:
      tags:
      - Api-V2 Supporting Data
      summary: Retrieve a collection template by id.
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
