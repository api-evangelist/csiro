      summary: Delete a collection template by id.
      operationId: deleteTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v2/admin/user/{id}:
    get:
      tags:
      - Api-V2 Admin
      summary: Get user information.
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAdminDTO'
    put:
      tags:
      - Api-V2 Admin
      summary: Update roles and status of existing user.
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAdminDTO'
  /api/v2/admin/updateForCode:
    put:
      tags:
      - Api-V2 Admin
      summary: Update a single FOR value on a data collection.
      operationId: updateForCode
      parameters:
      - name: collectionId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: oldForCode
        in: query
        required: true
        schema:
          type: string
      - name: newForCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/admin/systemTasks/{taskId}/retry:
    put:
      tags:
      - Api-V2 Admin
      summary: Reschedule a failed task.  This is used when all auto retries have already been attempted.
      operationId: manualRetry
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
