  /ws/v2/collections/searchbylocation:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections matching specific criteria, or to list all collections.
      operationId: getCollectionsByLocation
      parameters:
      - name: q
        in: query
        description: <b>searchString</b> (optional) can be any text to be searched for and will be processed in the same manner as front page search. If not present all accessible collections will be returned.
        required: false
        schema:
          type: string
          default: ''
      - name: browseType
        in: query
        description: <b>browseType</b> the browse type to search against e.g. kw
        required: false
        schema:
          type: string
      - name: browseValue
        in: query
        description: <b>browseValue</b> the value to search against the browse type.
        required: false
        schema:
          type: string
      - name: n
        in: query
        description: <b>north</b> (optional) the northern most point of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: s
        in: query
        description: <b>south</b> the southern most point of the desired area OR the Latitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: e
        in: query
        description: <b>east</b> (optional) the eastern most point of the desired area OR the longitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: w
        in: query
        description: <b>west</b> the Western most point  of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: locationSearchType
        in: query
        required: false
        schema:
          type: string
          default: INTERSECTION
          enum:
          - INTERSECTION
          - FULLYOUTSIDEOF
          - WITHIN
          - ENCLOSES
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        description: <b>showFacets</b> (optional) may be true or false. If not present it defaults to false. When true facet filter values will be returned in the query response. For further information on how to filter results using Faceting please refer to https://research.csiro.au/dap/developer-tools/search-facets
        required: false
        schema:
          type: boolean
          default: false
      - name: inclAttribution
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: atom
        in: query
        description: <b>ATOM</b> - Flag that indicates if atom feed should be generated.
        required: false
        schema:
          type: boolean
      - name: searchType
        in: query
        description: <b>searchType</b> - Type of area search (optional) may be INTERSECTION, FULLYOUTSIDEOF, WITHIN, or ENCLOSES. If not present it defaults to INTERSECTION.  This parameter is case sensitive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/atom+xml;type=entry:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
  /ws/v2/collections/search:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to search for collections by lead researcher or contributor, business unit, cost centre, research group, research program, WBS and FOR.
      operationId: getCollectionsSearch
      parameters:
      - name: name
        in: query
        description: <b>Name</b> (optional) returns collections which include the name as a lead researcher or contributor. Value can be a CSIRO username, or CSIRO email prefix (e.g. john.citizen), or combination of firstname and/or lastname (John Citizen/John John/John/John)
        required: false
        schema:
          type: string
          default: ''
      - name: cc
        in: query
        description: <b>Cost Centre</b> (optional) returns collections related to a Team given the cost centre code of the team. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Teams" endpoint use the "Id" key as your "Cost Centre" search).
        required: false
        schema:
          type: string
          default: ''
      - name: bu
        in: query
        description: <b>Business Unit</b> (optional) returns collections related to a Business Unit given the SAP code of the Business Unit. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (note that the results in OrgUnitServ use the key "Id" instead of "BusinessUnitCode").
        required: false
        schema:
          type: string
          default: ''
      - name: rp
        in: query
        description: <b>Research Program</b> (optional) returns collections related to a Research Program given the SAP code of the Research Program. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Programs" endpoint use the "Id" key as your "Research Program" search). Note that for these purposes "Program" means the program associated with a Business Unit, not the program associated with a WBS.
        required: false
        schema:
          type: string
          default: ''
      - name: rg
        in: query
        description: <b>Research Group</b> (optional) returns collections related to a Research Group given the SAP code of the Research Group. Use the <a href="https://orgunitserv.csiro.au/">Organisational Unit Service</a> to access codes (in the OrgUnitServ "Groups" endpoint use the "Id" key as your "Research Group" search).
        required: false
        schema:
          type: string
          default: ''
      - name: wbs
        in: query
        description: <b>WBS Code</b> (optional), must be at least 4 characters, returns collections related to a Project using the SAP WBS code for the project. You only need to use the first part of the code. For example R-001 finds R-00100-03 and R-00100-02-001 (DAP has R-xxxxxx, and R-xxxxx-xx formats)
        required: false
        schema:
          type: string
          default: ''
      - name: for
        in: query
        description: <b>Field of Research Code</b> (optional) returns collections related to an ANZ Field of Research (FOR) code. Use a FOR code or any part of a description. The code search looks for the beginning of any code and is hierarchical, e.g. 01 will return all mathematical sciences, 0101 will return a subset of mathematical sciences. The description search is auto expanded. For example the description "geo" will return both "GEOCHEMISTRY" and "Hydrogeology" See  <a href="https://vocabs.ands.org.au/anzsrc-for/">link</a> for the codes.
        required: false
        schema:
          type: string
          default: ''
      - name: p
        in: query
        description: <b>pageNo</b> (optional) is the number of the page being requested. If not present, page 1 is returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        description: <b>pageSize</b> (optional) is the maximum number of collections to be returned on each page. If not present will default to 25. If higher than 100 then 100 will be used.
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: soud
        in: query
        description: <b>soud</b> (optional) Show Only Unrestricted Data - may be be on or true. When on or true the search will only show records with unrestricted data. If not present or not on or true it defaults to false.
        required: false
        schema:
          type: string
          default: 'off'
      - name: psd
        in: query
        description: <b>psd</b> (optional) is the publication start date, when set the search will only return collections published on or after this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: ped
        in: query
        description: <b>ped</b> (optional) is the publication end date, when set the search will only return collections published on or before this date. Dates must match the ISO 8601 format e.g. 2017-03-29T17:21:37+10:00
        required: false
        schema:
          type: string
          default: ''
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      - name: showFacets
        in: query
        description: <b>facets</b> (optional) may be true or false. If not present it defaults to false. When true facet filter values will be returned in the query response. For further information on how to filter results using Faceting please refer to https://research.csiro.au/dap/developer-tools/search-facets
        required: false
        schema:
          type: boolean
          default: false
      - name: inclAttribution
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionsResultDto'
  /ws/v2/collections/searchByIndex:
    get:
      tags:
      - Collection Search
      summary: This function allows a client to browse collections using certain keywords.
      operationId: getCollectionByIndex
      parameters:
      - name: q
        in: query
        description: <b>searchString</b> (optional) can be any text to be searched for and will be processed in the same manner as front page search. If not present all accessible collections will be returned.
        required: false
        schema:
          type: string
          default: ''
      - name: browseType
        in: query
        description: <b>browseType</b> (optional) the browse type to search against e.g. kw
        required: false
        schema:
          type: string
          default: ''
      - name: browseValue
        in: query
        description: <b>browseValue</b> (optional) the value to search against the browse type.
        required: false
        schema:
          type: string
          default: ''
      - name: n
        in: query
        description: <b>north</b> (optional) the northern most point of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: s
        in: query
        description: <b>south</b> the southern most point of the desired area OR the Latitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: e
        in: query
        description: <b>east</b> (optional) the eastern most point of the desired area OR the longitudinal coordinate of the desired point
        required: false
        schema:
          type: number
          format: double
      - name: w
        in: query
        description: <b>west</b> the Western most point  of the desired area
        required: false
        schema:
          type: number
          format: double
      - name: searchType
        in: query
        description: <b>searchType</b> - Type of area search (optional) may be INTERSECTION, FULLYOUTSIDEOF, WITHIN, or ENCLOSES. If not present it defaults to INTERSECTION.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: INTERSECTION
          enum:
          - INTERSECTION
          - FULLYOUTSIDEOF
          - WITHIN
          - ENCLOSES
      - name: index
        in: query
        description: <b>index</b> is the position of the required data collection in the search results.
        required: true
        schema:
          type: integer
          format: int32
          default: 1
      - name: sb
        in: query
        description: <b>sb</b> - sortField (optional) may be RECENT, RELEVANCE, or TITLE. If not present it defaults to RELEVANCE.  This parameter is case sensitive.
        required: false
        schema:
          type: string
          default: RELEVANCE
          enum:
          - RELEVANCE
          - RECENT
          - TITLE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
