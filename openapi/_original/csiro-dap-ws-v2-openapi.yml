# x-archived-from: csiro-dap-ws-v2-openapi.yml
# x-archived-on: 2026-10-22
openapi: 3.1.0
info:
  title: CSIRO Data Access Portal
  description: REST API for the CSIRO Data Access Portal (DAP).
  version: v2
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
paths:
  /ws/v2/domains/specimenImages/validateTerms:
    get:
      tags:
      - Specimen_Images
      summary: Given a comma-separated list of terms, returns those that do not match any document in the specimen images index. Use fieldType to restrict the search to a single field (taxonomy, specimenId, or fieldNumber); omit fieldType to search across all three (any).
      operationId: validateTerms
      parameters:
      - name: any
        in: query
        required: true
        schema:
          type: string
      - name: nationalSpecimenCollection
        in: query
        required: false
        schema:
          type: string
      - name: fieldType
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
    post:
      tags:
      - Specimen_Images
      summary: POST variant of the validateTerms endpoint. Accepts the same parameters as the GET endpoint in a JSON request body to avoid URL length limits.
      operationId: postValidateTerms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecimenImageValidateTermsRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /ws/v2/domains/specimenImages/search:
    get:
      tags:
      - Specimen_Images
      summary: This function allows a client to search for specimen images by accession number or catalog number(s) or the taxonomy(). In the instance where user does not provide any search query it will return all the search images.
      operationId: getSpecimenImageResults
      parameters:
      - name: nationalSpecimenCollection
        in: query
        required: false
        schema:
          type: string
      - name: any
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: taxonomy
        in: query
        description: '<b>Taxonomy</b> (optional) returns specimen images which include the either the kingdom, phylum, class, order,family, subfamily, genus, subgenus, species, subspecies or scientific name as the taxonomy. Value can be a Plantae, Commelinaceae, Commelina, tricarinata etc '
        required: false
        schema:
          type: array
          items:
            type: string
      - name: specimenId
        in: query
        description: <b>SpecimenId</b> (optional) returns specimen images which include the either the accession number or the catalog number as the specimenId.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: dataCollectionId
        in: query
        required: false
        schema:
          type: string
      - name: fieldNumber
        in: query
        description: '<b>FieldNumber</b> (optional) returns specimen images which include field number '
        required: false
        schema:
          type: array
          items:
            type: string
      - name: dataAccessLevel
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: <b>General Search</b> (optional) performs a general search across taxonomy (kingdom, phylum, class, order, family, subfamily, genus, subgenus, species, subspecies, scientific names), catalog number, accession number, and field number. This parameter searches across multiple fields simultaneously.
        required: false
        schema:
          type: string
          default: ''
      - name: p
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: rpp
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - name: sb
        in: query
        required: false
        schema:
          type: string
          default: catalogNumber
      - name: so
        in: query
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      - name: showFacets
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: fSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: collector
        in: query
        description: <b>Collector</b> (optional) returns specimen images which include collector name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
    post:
      tags:
      - Specimen_Images
      summary: POST variant of the specimen images search endpoint. Accepts the same parameters as the GET endpoint in a JSON request body to avoid URL length limits.
      operationId: postSpecimenImageResults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecimenImageSearchRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            text/xml:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/SpecimenImageResultDto'
