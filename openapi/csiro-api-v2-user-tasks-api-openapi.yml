openapi: 3.2.0
info:
  title: Csiro Api-V2 User Tasks API
  version: v2
  description: 'Operations tagged Api-V2 User Tasks across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 User Tasks
paths:
  /api/v2/usertasks/{taskId}/approval:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve details for the collection approver
      operationId: getApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Approval task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApproverDecisionDTO'
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save an approval decision (without submitting the decision)
      operationId: saveApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproverDecisionDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/approval/submit:
    put:
      tags:
      - Api-V2 User Tasks
      summary: Submit an approval decision and start any downstream processing
      operationId: submitApprovalDecision
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproverDecisionDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/advice:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve an approval advice record
      operationId: getAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApprovalAdviceDTO'
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save an advice request (without submitting)
      operationId: saveAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAdviceDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/advice/submit:
    put:
      tags:
      - Api-V2 User Tasks
      summary: Save and submit an advice request
      operationId: submitAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAdviceDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/validation:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve a CASDA observation validation record
      operationId: getValidation
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA Validation task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CasdaObservationValidationDTO'
    post:
      tags:
      - Api-V2 User Tasks
      summary: Save a CASDA observation validation record
      operationId: saveValidation
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA Validation task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: completed
        in: query
        required: true
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaObservationValidationDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/release/unrelease:
    post:
      tags:
      - Api-V2 User Tasks
      summary: Unrelease a CASDA observation release record - i.e. reject all data
      operationId: unReleaseReleaseTask
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA release task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: validationDto
        in: query
        description: DTO of CASDA release task.
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaObservationValidationDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/release/save:
    post:
      tags:
      - Api-V2 User Tasks
      summary: Save a CASDA observation release record.
      operationId: saveReleaseTask
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA release task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: validationDto
        in: query
        description: DTO of CASDA release task.
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaObservationValidationDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/release/release:
    post:
      tags:
      - Api-V2 User Tasks
      summary: Release all data products from a CASDA observation project block
      operationId: releaseReleaseTask
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA release task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: validationDto
        in: query
        description: DTO of CASDA release task.
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaObservationValidationDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/release/partialrelease:
    post:
      tags:
      - Api-V2 User Tasks
      summary: Partially release a project block.
      operationId: partialReleaseReleaseTask
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA release task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      - name: validationDto
        in: query
        description: DTO of CASDA release task.
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasdaObservationValidationDTO'
        required: true
      responses:
        '200':
          description: OK
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/approval/advice:
    post:
      tags:
      - Api-V2 User Tasks
      summary: Create an advice request related to the specified approval task
      operationId: createAdviceRequest
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAdviceDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApprovalAdviceDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve open tasks for the current user
      operationId: getTasks
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTaskDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/release:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve a CASDA observation release record
      operationId: getRelease
      parameters:
      - name: taskId
        in: path
        description: Task Id of the CASDA release task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CasdaObservationValidationDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/{taskId}/approval/decisions:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve valid approver decisions for the given task
      operationId: getApprovalDecisionsForTask
      parameters:
      - name: taskId
        in: path
        description: Task Id of the Provide Advice task.
        required: true
        schema:
          type: integer
          format: int32
        example: 12345
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdWithDescriptionDto'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/sbid/{sbid}/{projectCode}/{taskType}:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve a CASDA observation validation record by sbid
      operationId: getActivityTaskId
      parameters:
      - name: sbid
        in: path
        description: sbid of CASDA observation.
        required: true
        schema:
          type: string
      - name: projectCode
        in: path
        description: Obseration Project code.
        required: true
        schema:
          type: string
      - name: taskType
        in: path
        description: Type of activity task.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/usertasks/count:
    get:
      tags:
      - Api-V2 User Tasks
      summary: Retrieve count of open tasks for the current user
      operationId: getTaskCount
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserTaskCountDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
components:
  schemas:
    CasdaObservationValidationDTO:
      type: object
      description: DTO of CASDA release task.
      properties:
        sbid:
          type: integer
          format: int32
        observationId:
          type: integer
          format: int64
        opalCode:
          type: string
        obsStartDateMillis:
          type: integer
          format: int64
        principalFirstName:
          type: string
        principalLastName:
          type: string
        globalQualityLevel:
          type: string
        subTypes:
          type: array
          items:
            $ref: '#/components/schemas/CasdaDataProductSubTypeValidationDTO'
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/CasdaDataProductValidationDTO'
        validationNotes:
          type: array
          items:
            $ref: '#/components/schemas/CasdaValidationNoteDTO'
        projectName:
          type: string
        taskTitle:
          type: string
        encapsulationFileIds:
          type: array
          items:
            type: string
        validationReportUrl:
          type: string
        validationMetrics:
          type: array
          items:
            $ref: '#/components/schemas/CasdaValidationMetricDTO'
    UserTaskCountDTO:
      type: object
      properties:
        count:
          type: integer
          format: int32
    CasdaValidationNoteDTO:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int64
        userId:
          type:
          - string
          - 'null'
        userName:
          type:
          - string
          - 'null'
        content:
          type:
          - string
          - 'null'
        createdDate:
          type:
          - integer
          - 'null'
          format: int64
    IdWithDescriptionDto:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
    ApprovalAdviceDTO:
      type: object
      properties:
        adviceId:
          type: integer
          format: int32
        adviser:
          $ref: '#/components/schemas/UserEntityDto'
        approver:
          $ref: '#/components/schemas/UserEntityDto'
        approverRequest:
          type: string
        adviserComments:
          type: string
        dueDate:
          type: string
        adviceStatus:
          type: string
    CasdaValidationMetricDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: integer
          format: int32
        value:
          type: number
          format: double
    CasdaDataProductSubTypeValidationDTO:
      type: object
      properties:
        type:
          type: string
        subType:
          type: string
        qualityLevel:
          type: string
        count:
          type: integer
          format: int32
    ApproverDecisionDTO:
      type: object
      properties:
        dataCollectionId:
          type: integer
          format: int32
        depositor:
          $ref: '#/components/schemas/UserEntityDto'
        notesToApprover:
          type: string
        approvalAdvices:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalAdviceDTO'
        supportingFilesForApprover:
          type: array
          items:
            $ref: '#/components/schemas/SupportingFileDTO'
        previouslyApprovedForAllVersions:
          type: boolean
        willUnblock:
          type: boolean
        blockReason:
          type: string
        comments:
          type: string
        decision:
          type: string
    CasdaDataProductValidationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        subType:
          type: string
        identifier:
          type: string
        fileName:
          type: string
        qualityLevel:
          type: string
    UserTaskDTO:
      type: object
      properties:
        taskId:
          type: integer
          format: int32
        dataCollectionId:
          type: integer
          format: int32
        fedoraId:
          type: string
        versionNumber:
          type: integer
          format: int32
        dataCollectionTitle:
          type: string
        assignedDate:
          type: string
        dueDate:
          type: string
        taskTypeCode:
          type: string
        taskTypeDescription:
          type: string
        dueWithinWeek:
          type: boolean
        overdue:
          type: boolean
    SupportingFileDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        fileName:
          type: string
    UserEntityDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userName:
          type: string
        email:
          type: string
        loginSystem:
          type: string
        distinguishedName:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        surname:
          type: string
        organisation:
          type: string
        organisationDisplay:
          type: string
        rorId:
          type: string
        country:
          type: string
        countryDisplayName:
          type: string
        state:
          type: string
        type:
          type: string
        city:
          type: string
        notes:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/0fe05593-19ac-4f98-adbf-0375fce7f160/oauth2/v2.0/authorize
          tokenUrl: /dap/auth/csiro/token
          scopes:
            openid: OpenID Connect
