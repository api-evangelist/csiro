            text/xml:
              schema:
                $ref: '#/components/schemas/CasdaObservationSearchDto'
      summary: Get casda observation search dto
      x-summary-source: derived
    post:
      tags:
      - CASDA
      operationId: getCasdaObservationResults
      requestBody:
