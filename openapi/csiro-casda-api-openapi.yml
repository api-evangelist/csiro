  /ws/v2/domains/casdaCutout/cutout:
    get:
      tags:
      - CASDA
      summary: Process a request to find cutout dataproducts
      operationId: getCutoutDetail
      parameters:
      - name: surveys
        in: query
        description: The code of the survey to be queried e.g. CasdaSurveyDto.code
        required: true
        schema:
          type: array
          items:
            type: string
        example: RACS-Low
      - name: ra
        in: query
        description: The Right ascension portion of the position, in decimal degrees.
        required: true
        schema:
          type: string
        example: 125.6
      - name: dec
        in: query
        description: The Declination portion of the position, in decimal degrees.
        required: true
        schema:
          type: string
        example: -43.0
      - name: size
        in: query
        description: The size of the cutout, in decimal degrees.
        required: true
        schema:
          type: string
        example: 0.5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
