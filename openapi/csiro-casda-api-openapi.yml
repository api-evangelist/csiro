components:
  schemas:
    CatalogueResultDto:
      type: object
      properties:
        totalResults:
          type: string
        page:
          type: integer
          format: int32
        resultsPerPage:
          type: integer
          format: int32
        allAvailable:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueDto'
          xml:
            wrapped: true
      required:
      - page
      - resultsPerPage
      - totalResults
    CasdaCutoutDto:
      type: object
      properties:
        title:
          type: string
        dataUrl:
          type: string
        previewUrl:
