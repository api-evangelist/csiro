openapi: 3.2.0
info:
  title: Csiro Api-V2 DNA Sequence Collections API
  version: v2
  description: 'Operations tagged Api-V2 DNA Sequence Collections across 2 of this provider''s published API definitions: csiro-dap-api-v2-openapi.json, csiro-dap-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://data.csiro.au/dap
  description: Generated server url
security:
- basicAuth: []
- bearerAuth: []
- oauth2: []
tags:
- name: Api-V2 DNA Sequence Collections
paths:
  /api/v2/domains/publishedDnaSequence/searchByUids:
    post:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Retrieve published Sequence collection IDs by specified unique IDs
      operationId: getAllCollectionIds
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SequenceCollectionsDTO'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/domains/publishedDnaSequenceByCollectionId/{dapCollectionId}:
    get:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Get a published sequence collection by DAP collection ID
      operationId: getCollectionByCollectionId
      parameters:
      - name: dapCollectionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/domains/publishedDnaSequenceByCollectionId/{dapCollectionId}/data:
    get:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Get a list of a collection's data files
      operationId: getCollectionDataFileList
      parameters:
      - name: dapCollectionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataFilesDto'
      deprecated: true
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/domains/publishedDnaSequenceByCollectionId/{dapCollectionId}/data/{fileId}:
    get:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Get one of a collection's data files
      operationId: getCollectionDataFile
      parameters:
      - name: dapCollectionId
        in: path
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
      deprecated: true
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/domains/publishedDnaSequence/{uid}:
    get:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Retrieve a published Sequence collection by unique id
      operationId: getCollectionByUid
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
  /api/v2/domains/dnaSequence/{uid}:
    get:
      tags:
      - Api-V2 DNA Sequence Collections
      summary: Retrieve a Sequence collection (can be any deposit status) by unique id
      operationId: getDNASequenceCollectionByUid
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataCollectionDtoV2'
    servers:
    - url: https://data.csiro.au/dap
      description: Generated server url
